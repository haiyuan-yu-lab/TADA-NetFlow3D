# Paths are relative to the repository root; absolute paths are also supported.
# Each cohort is fitted separately. These runs do not combine cohort BFs.
tada:
  info-file: examples/input/tada/shared/gene_information.tsv
  prior-file: examples/input/tada/shared/priors.tsv
  mut-col: mut.em
  dn-coding: true
  in-coding: true
  dn-noncoding: true
  in-noncoding: true
  in-floor: false
  cohorts:
    SSC_KOR_STAR:
      coding-file: examples/input/tada/SSC_KOR_STAR/coding_counts.tsv
      noncoding-file: examples/input/tada/SSC_KOR_STAR/noncoding_counts.tsv
      sample-file: examples/input/tada/SSC_KOR_STAR/sample_sizes.tsv
      output-file: results/examples/tada/SSC_KOR_STAR/tada_results.tsv
    SPARK:
      coding-file: examples/input/tada/SPARK/coding_counts.tsv
      noncoding-file: examples/input/tada/SPARK/noncoding_counts.tsv
      sample-file: examples/input/tada/SPARK/sample_sizes.tsv
      output-file: results/examples/tada/SPARK/tada_results.tsv
netflow3d:
  interactome: examples/input/interactome.tsv
  id_mapping: examples/input/id_mapping.tsv
  disrupted_interactions: examples/input/disrupted_interactions.tsv
  expressed_genes: null
  restart_probability: 0.2
  disrupted_edge_weight: 5.0
  resolution: low
  max_subnetwork_size: 10
  delta_trials: 2
  random_seed: 2062
  threads: 1
  